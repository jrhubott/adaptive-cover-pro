---
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep this rev inside the `ruff` constraint in requirements-dev.txt, which is
    # what CI installs (.github/workflows/tests.yml runs `ruff check .` against it).
    # If the two drift apart they can disagree on a rule's fix and silently revert
    # each other: v0.4.5 and v0.15 take opposite sides on SIM300, so the hook undid
    # the fix CI demanded and develop sat red for five builds.
    rev: v0.15.22
    hooks:
      # Run the linter.
      - id: ruff-check
        types_or: [python, pyi, jupyter]
        args: [--fix]
  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.5.1
    hooks:
      - id: black
        types_or: [python, pyi]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-added-large-files
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: check-yaml
        args: ["--unsafe"]
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v2.7.1
    hooks:
      - id: prettier
        name: 🎨 Format using prettier
  - repo: local
    hooks:
      - id: validate-translations
        name: Validate translations match en.json
        entry: scripts/validate_translations.py --ci
        language: system
        pass_filenames: false
        files: ^custom_components/adaptive_cover_pro/translations/.*\.json$
