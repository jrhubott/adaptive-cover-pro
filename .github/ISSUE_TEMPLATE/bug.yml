---
name: "Bug report"
description: "Report a bug with the integration"
labels: "bug"
body:
  - type: markdown
    attributes:
      value: >
        **Only three things are required:** the version, a description, and the diagnostics file.
        Everything below that is optional — fill in what's relevant to your bug and skip the rest.


        Before filing, it's worth a look at the [Troubleshooting wiki page](https://github.com/jrhubott/adaptive-cover-pro/wiki/Troubleshooting),
        the built-in **Troubleshoot** step (cover options → Troubleshoot) and its [findings](https://github.com/jrhubott/adaptive-cover-pro/wiki/Troubleshooting-Findings),
        the [latest release](https://github.com/jrhubott/adaptive-cover-pro/releases/latest),
        and [existing bug reports](https://github.com/jrhubott/adaptive-cover-pro/issues?q=is%3Aissue+label%3Abug). One bug per issue, please.

  - type: checkboxes
    attributes:
      label: Checklist
      options:
        - label: This is an issue with the **integration**, not the companion Dashboard Card. Card bugs belong in the [Adaptive Cover Pro Card issue tracker](https://github.com/jrhubott/adaptive-cover-pro-card/issues/new/choose).
          required: true

  - type: input
    id: version
    attributes:
      label: Adaptive Cover Pro version
      description: "Found under Settings → Devices & Services → Adaptive Cover Pro."
      placeholder: "e.g. 2026.8.0"
    validations:
      required: true

  - type: textarea
    attributes:
      label: Describe the issue
      description: "What happened, and what you expected instead."
      placeholder: |
        What happened?

        What did you expect to happen?

        What does sensor.{device}_decision_trace show? (state and trace attribute, if relevant)
    validations:
      required: true

  - type: textarea
    attributes:
      label: Diagnostics file (attachment)
      description: >
        **Drag the JSON file into this box. Do not paste the file contents** — issues without an attached diagnostics file will be auto-labeled `needs-diagnostics` and closed after 7 days.


        Download from **Settings → Devices & Services → Adaptive Cover Pro** → select the affected cover → **⋮ → Download diagnostics**.
        See [Downloading Diagnostics](https://github.com/jrhubott/adaptive-cover-pro/wiki/Configuration-Debug-Diagnostics#downloading-diagnostics) for step-by-step instructions.


        If GitHub refuses the `.json` file on drag-drop, zip it first or rename the file to `.txt`.
    validations:
      required: false

  - type: markdown
    attributes:
      value: >
        ### Everything below is optional


        Fill these in when the problem is with **how your specific cover behaves** — it doesn't reach the
        commanded position, reports the wrong state, moves when it shouldn't, tilts incorrectly, or only
        misbehaves on one brand of motor. For logic bugs, config-flow bugs, and UI bugs, skip them.
        The diagnostics file already carries your Home Assistant version, cover type, and full configuration.

  - type: dropdown
    id: cover_type
    attributes:
      label: Cover type
      description: "As shown in the integration's cover type selector."
      options:
        - "Vertical blind"
        - "Horizontal awning"
        - "Venetian / tilt blind (tilt-only)"
        - "Venetian blind (dual-axis)"
        - "Oscillating awning (drop-arm)"
        - "Roof window"
        - "Sliding curtain (horizontal)"
        - "Louvered roof"
        - "Day/night shade (dual-fabric)"
        - "Dual panel (sheer + blackout)"
        - "Not sure / not applicable"
    validations:
      required: false

  - type: input
    id: cover_hardware
    attributes:
      label: Cover hardware
      description: "Brand, model, and how Home Assistant talks to it. Only the brand is useful on its own — partial answers are fine."
      placeholder: "e.g. Brel hub-03, 433 MHz  ·  Somfy Sonesse 30, Zigbee"
    validations:
      required: false

  - type: input
    id: homeassistant
    attributes:
      label: Home Assistant version
      description: >
        Found in: [**Settings** > **About**](https://my.home-assistant.io/redirect/info/). Skip if you attached diagnostics.
      placeholder: "e.g. 2026.8.0"
    validations:
      required: false

  - type: textarea
    attributes:
      label: Reproduction steps
      description: "Numbered steps, if the bug happens on demand. Leave blank if it's intermittent."
      placeholder: |
        1.
        2.
        3.
    validations:
      required: false
